{{/*
  CR-003 / TD-003 — Refuse to render the chart with placeholder secrets.

  `helm install sentri ./helm/sentri` with the bundled `values.yaml`
  would otherwise ship `JWT_SECRET=change-me` and `ENCRYPTION_KEY=change-me`
  to the cluster. JWT_SECRET=change-me means every issued token is
  predictable; ENCRYPTION_KEY=change-me means every stored API key
  (Anthropic, OpenAI, GitHub App installation IDs, route apiKeyEncrypted)
  can be decrypted by anyone with database read access.

  Operators must override both via `--set secrets.JWT_SECRET=...` /
  `--set secrets.ENCRYPTION_KEY=...` or a sealed-secrets values file.
  The `fail` call below aborts `helm template` / `helm install` /
  `helm upgrade` with a human-readable error rather than silently
  deploying weak crypto.
*/}}
{{- if or (eq .Values.secrets.JWT_SECRET "change-me") (not .Values.secrets.JWT_SECRET) -}}
{{- fail "secrets.JWT_SECRET must be overridden (current value is the 'change-me' placeholder or empty). Pass --set secrets.JWT_SECRET=<random-32+ char string> or set it in your values override file." -}}
{{- end -}}
{{- if or (eq .Values.secrets.ENCRYPTION_KEY "change-me") (not .Values.secrets.ENCRYPTION_KEY) -}}
{{- fail "secrets.ENCRYPTION_KEY must be overridden (current value is the 'change-me' placeholder or empty). Pass --set secrets.ENCRYPTION_KEY=<random-32+ char string> or set it in your values override file." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: sentri-secrets
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.ENCRYPTION_KEY | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | default "sentri" | quote }}
  # DATABASE_URL + REDIS_URL live here (not in the ConfigMap) because
  # the connection-string format embeds credentials. envFrom mounts
  # this Secret onto both backend + worker Deployments, so the URLs
  # land as env vars on the pod identically to ConfigMap-sourced ones.
  DATABASE_URL: {{ .Values.env.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
