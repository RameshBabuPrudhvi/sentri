apiVersion: v1
kind: Secret
metadata:
  name: sentri-secrets
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.ENCRYPTION_KEY | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | default "sentri" | quote }}
  # DATABASE_URL + REDIS_URL live here (not in the ConfigMap) because
  # the connection-string format embeds credentials. envFrom mounts
  # this Secret onto both backend + worker Deployments, so the URLs
  # land as env vars on the pod identically to ConfigMap-sourced ones.
  DATABASE_URL: {{ .Values.env.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
