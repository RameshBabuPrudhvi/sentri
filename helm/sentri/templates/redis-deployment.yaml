{{- if not .Values.redis.cluster.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentri-redis
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports: [{ containerPort: 6379 }]
{{- end }}
