apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentri-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: {{ .Values.worker.image }}
          env:
            - name: WORKER_HEALTH_PORT
              value: {{ .Values.worker.healthPort | quote }}
          envFrom:
            - configMapRef: { name: sentri-config }
            - secretRef: { name: sentri-secrets }
          # readinessProbe gates job dispatch on Redis reachability + the
          # BullMQ worker being booted. A failed readiness probe only
          # stops new traffic — it does NOT restart the pod.
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.worker.healthPort }} }
          # livenessProbe MUST be dependency-free. `/livez` (defined in
          # backend/src/worker.js) returns 200 unconditionally if the
          # Node process is responsive. Pointing this at `/healthz` would
          # make kubelet restart the worker pod every time Redis blips,
          # turning a transient outage into a thundering-herd restart
          # loop that masks the actual problem.
          livenessProbe:
            httpGet: { path: /livez, port: {{ .Values.worker.healthPort }} }
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
