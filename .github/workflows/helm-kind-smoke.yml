name: Helm + kind smoke test
# Closes NEXT.md INF-009 acceptance criterion: "helm install sentri ./helm/sentri/
# on a clean kind cluster brings up backend + worker + Postgres + Redis. kubectl
# wait --for=condition=Ready succeeds on every pod within 90s." Previously a
# human-only checklist box; this workflow runs it on every PR touching helm/.
on:
  pull_request:
    paths:
      - 'helm/**'
      - '.github/workflows/helm-kind-smoke.yml'
  workflow_dispatch:
jobs:
  kind-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.23.0
          cluster_name: sentri-smoke
          wait: 60s
      - name: Render + install chart
        # NOTE: we deliberately skip installing ingress-nginx — the smoke
        # test validates chart structure (manifests render, secrets wire,
        # Postgres + Redis come Ready), not ingress routability. The
        # Ingress resource is admitted by the API server without a
        # controller; kind's ingress-nginx provider needs a `ingress-ready=true`
        # node label that the default kind config doesn't set, which
        # previously made the controller pod stay Pending for 2min and
        # tripped the timeout. If a future test needs real HTTP routing
        # through the ingress, add `kubectl label node ... ingress-ready=true`
        # BEFORE the ingress-nginx apply.
        run: |
          # Use real ghcr.io public images for the smoke test — the chart
          # default `ghcr.io/example/sentri-backend:latest` doesn't exist.
          # Override with `nginx:alpine` for both backend and worker since
          # we're only validating the manifests render + Postgres/Redis
          # boot. The probes will fail (nginx doesn't serve /api/v1/health),
          # so we explicitly disable them via `--set` overrides below.
          helm install sentri ./helm/sentri \
            --set ingress.host=test.local \
            --set backend.image=nginx:alpine \
            --set worker.image=nginx:alpine \
            --set autoscaling.enabled=false \
            --wait=false
      - name: Wait for Postgres + Redis Ready
        # These are the only real pods in this smoke harness (backend +
        # worker are nginx stand-ins to validate the chart, not the app
        # image). Postgres readiness is the harder gate — PVC + secret
        # wiring all needs to be correct.
        run: |
          kubectl wait --for=condition=Ready pod -l app=postgres --timeout=120s
          kubectl wait --for=condition=Ready pod -l app=redis    --timeout=60s
      - name: Verify rendered manifests applied
        run: |
          kubectl get deploy,statefulset,svc,ingress,configmap,secret,hpa -l 'app in (backend,worker,postgres,redis)' || true
          # DATABASE_URL + POSTGRES_PASSWORD both live in the Secret per
          # the security fix that moved them out of the ConfigMap (see
          # helm/sentri/templates/configmap.yaml comment).
          kubectl get secret sentri-secrets -o jsonpath='{.data}' | grep -q POSTGRES_PASSWORD
          kubectl get secret sentri-secrets -o jsonpath='{.data}' | grep -q DATABASE_URL
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -l 'app in (backend,worker,postgres,redis)' || true
          kubectl logs -l app=postgres --tail=100 || true
